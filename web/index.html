<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>归巢 · NestBot</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main>
<header><div><span class="brand">归巢</span><span class="muted">NESTBOT</span></div><div><span id="connection">未登录</span><button id="logout" hidden>退出</button></div></header>
<section id="login-panel"><h1>你的文件，回到自己的巢。</h1><p class="muted">登录以管理搜索、转存和任务队列。</p><form id="login-form"><label>管理密码<input name="password" type="password" required autocomplete="current-password"></label><button type="submit">登录管理台</button></form></section>
<div id="workspace" hidden>
<nav><button data-page="overview" class="selected">总览</button><button data-page="tasks">任务</button><button data-page="vault">密钥夹</button><button data-page="settings">配置</button><button data-page="logs">运行记录</button></nav>
<section id="overview" class="page"><h1>运行总览</h1><div id="stats" class="cards"></div><h2>最近任务</h2><div id="overview-jobs"></div></section>
<section id="tasks" class="page" hidden><h1>任务</h1><div class="columns"><form id="search-form" class="panel"><h2>搜索并存入密钥夹</h2><label>关键词<input name="keyword" required maxlength="1024"></label><label>页数<input name="pages" type="number" min="1" placeholder="留空自动翻页"></label><label>排序<select name="sort"><option value="">默认</option><option value="time">时间</option><option value="hot">热度</option><option value="count">文件数量</option></select></label><label class="check"><input name="resume" type="checkbox">继续上次搜索</label><button>创建搜索任务</button></form><form id="transfer-form" class="panel"><h2>凭密钥转存</h2><label>密钥，每行一个<textarea name="keys" rows="4" required></textarea></label><label>处理方式<select name="mode"><option value="copy">copy · 引用转存</option><option value="deep">deep · 下载重传</option></select></label><label>目标<input name="target" class="target-input" required></label><label class="check"><input name="dry_run" type="checkbox">只领取并统计</label><button>创建转存任务</button></form></div><div class="toolbar"><button id="refresh-jobs">刷新</button><button id="clear-queue" class="secondary">清空排队任务</button></div><div id="jobs"></div><div class="toolbar"><button id="jobs-prev">上一页</button><button id="jobs-next">下一页</button></div></section>
<section id="vault" class="page" hidden><h1>密钥夹</h1><p class="muted">搜索结果加密保存。点击批次查看和批量转存。</p><div id="batches"></div><div class="toolbar"><button id="batches-prev">上一页</button><button id="batches-next">下一页</button></div><div id="batch-detail" hidden><h2 id="batch-title"></h2><form id="batch-form" class="panel compact"><label>起始序号<input name="start" type="number" min="1" value="1"></label><label>结束序号<input name="end" type="number" min="1" placeholder="留空至末尾"></label><label>处理方式<select name="mode"><option value="copy">copy</option><option value="deep">deep</option></select></label><label>目标<input name="target" class="target-input" required></label><button>转存此序号范围</button></form><div id="entries"></div><div class="toolbar"><button id="entries-prev">上一页</button><button id="entries-next">下一页</button></div></div></section>
<section id="settings" class="page" hidden><h1>配置</h1><form id="settings-form" class="panel"><label>默认目标聊天 ID 或 @用户名<input name="target" id="setting-target"></label><label>默认处理方式<select name="mode" id="setting-mode"><option value="copy">copy · 引用转存</option><option value="deep">deep · 下载重传</option></select></label><button>保存默认设置</button><p class="muted">已排队任务使用创建时的目标与模式。账号登录、白名单和资源上限通过 CLI 与配置文件管理。</p></form><pre id="limits"></pre></section>
<section id="logs" class="page" hidden><h1>运行记录</h1><p class="muted">这里只显示任务状态与脱敏错误代码。</p><div id="log-list"></div></section>
</div><div id="notice" role="status" aria-live="polite"></div><footer>归巢 · 单进程运行，任务与密钥加密持久化</footer></main></body></html>
