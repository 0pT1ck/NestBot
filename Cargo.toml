[package]
name = "nestbot"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Resource-bounded Telegram archive service"
license = "MIT"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["json", "form"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
futures-util = "0.3"
getrandom = "0.3"
# grammers-crypto 0.10 uses the rc0 API; rc1 changes BigUint and return types.
glass_pumpkin = "=2.0.0-rc0"
grammers-client = "=0.10.0"
grammers-mtsender = { version = "=0.10.0", features = ["proxy"] }
grammers-session = { version = "=0.10.0", default-features = false, features = ["serde"] }
grammers-tl-types = "=0.10.0"
hex = "0.4"
hmac = "0.12"
pbkdf2 = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream"] }
rpassword = "7"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
teloxide = { version = "0.17", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["rt", "net", "time", "signal", "sync", "fs", "io-util", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
