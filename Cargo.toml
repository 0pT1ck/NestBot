[package]
name = "nestbot"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
anyhow = "1"
fs2 = "0.4"
grammers-client = "=0.11.0"
grammers-mtsender = "=0.11.0"
grammers-session = "=0.11.0"
grammers-tl-types = "=0.11.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "signal", "sync", "time", "net", "io-util"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
