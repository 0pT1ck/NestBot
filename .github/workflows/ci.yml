name: Verify and build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - name: Smoke directory-local launcher
        run: |
          cp target/release/nestbot nestbot
          cp config/nestbot.example.toml config/nestbot.toml
          cp config/secrets.example.env config/secrets.env
          root="$PWD"
          (
            cd /tmp
            "$root/deploy/run-local.sh" doctor
            "$root/deploy/run-local.sh" init
          )
          test -f .local/data/nestbot.sqlite
          test -f .local/data/master.key
      - run: tar -czf nestbot-linux-x86_64.tar.gz nestbot deploy config/nestbot.example.toml config/secrets.example.env README.md docs
      - uses: actions/upload-artifact@v4
        with:
          name: nestbot-linux-x86_64
          path: nestbot-linux-x86_64.tar.gz
