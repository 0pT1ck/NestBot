name: Verify and build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - run: cp target/release/nestbot nestbot && tar -czf nestbot-linux-x86_64.tar.gz nestbot deploy config/secrets.example.env README.md docs
      - uses: actions/upload-artifact@v4
        with:
          name: nestbot-linux-x86_64
          path: nestbot-linux-x86_64.tar.gz
